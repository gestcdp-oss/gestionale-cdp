<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Icona TR.A.V.I.">
  <!-- Icona dell'applicazione: trave di legno con caschetto da cantiere e la
       planimetria in mano. Niente gambe e pochi dettagli fini, così il soggetto
       riempie il riquadro e resta leggibile anche a 32 o 16 pixel. -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF6"/>
      <stop offset="1" stop-color="#ECE1CD"/>
    </linearGradient>
    <linearGradient id="legno" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DFAE72"/>
      <stop offset="1" stop-color="#8F5620"/>
    </linearGradient>
    <linearGradient id="casco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD645"/>
      <stop offset="1" stop-color="#EFA400"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="54" fill="url(#fondo)"/>

  <!-- BRACCIO DESTRO alzato verso la planimetria -->
  <path d="M158 152 Q188 140 198 108" fill="none" stroke="#3A2A1E" stroke-width="26" stroke-linecap="round"/>
  <path d="M158 152 Q188 140 198 108" fill="none" stroke="#8F5620" stroke-width="15" stroke-linecap="round"/>

  <!-- PLANIMETRIA (il progetto in mano) -->
  <g transform="rotate(-12 212 76)">
    <rect x="182" y="34" width="60" height="74" rx="6" fill="#EAF2FB" stroke="#2F6FB3" stroke-width="9"/>
    <rect x="196" y="50" width="32" height="42" fill="none" stroke="#3B7DD8" stroke-width="6"/>
    <path d="M196 76 H214" stroke="#3B7DD8" stroke-width="6"/>
  </g>
  <circle cx="199" cy="106" r="15" fill="#C6893F" stroke="#3A2A1E" stroke-width="8"/>

  <!-- CORPO (trave) -->
  <path d="M22 132 Q92 110 162 132 L162 200 Q162 222 140 222 L44 222 Q22 222 22 200 Z"
        fill="url(#legno)" stroke="#3A2A1E" stroke-width="9" stroke-linejoin="round"/>
  <path d="M58 127 Q52 174 58 219" fill="none" stroke="#7C4A20" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  <path d="M126 127 Q132 174 126 219" fill="none" stroke="#7C4A20" stroke-width="7" stroke-linecap="round" opacity="0.85"/>

  <!-- OCCHI -->
  <ellipse cx="70" cy="164" rx="18" ry="19" fill="#FFFFFF" stroke="#3A2A1E" stroke-width="8"/>
  <ellipse cx="116" cy="164" rx="18" ry="19" fill="#FFFFFF" stroke="#3A2A1E" stroke-width="8"/>
  <circle cx="74" cy="167" r="8" fill="#2B2620"/>
  <circle cx="120" cy="167" r="8" fill="#2B2620"/>

  <!-- SORRISO -->
  <path d="M74 196 Q93 210 112 196" fill="none" stroke="#3A2A1E" stroke-width="8" stroke-linecap="round"/>

  <!-- CASCHETTO -->
  <path d="M34 120 Q34 50 93 48 Q152 50 152 120 Z" fill="url(#casco)" stroke="#3A2A1E" stroke-width="9" stroke-linejoin="round"/>
  <rect x="10" y="114" width="166" height="22" rx="11" fill="url(#casco)" stroke="#3A2A1E" stroke-width="9"/>
  <path d="M93 54 L93 114" stroke="#DA9A00" stroke-width="8" stroke-linecap="round"/>
  <path d="M52 110 Q56 72 82 58" fill="none" stroke="#FFE894" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
</svg>
