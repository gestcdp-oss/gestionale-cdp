<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Icona TR.A.V.I.">
  <!-- Icona dell'applicazione: solo il soggetto riconoscibile (trave di legno con
       caschetto da cantiere), grande e con pochi dettagli, così resta leggibile
       anche a 32 o 16 pixel. La mascotte completa vive dentro l'app. -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF6"/>
      <stop offset="1" stop-color="#ECE1CD"/>
    </linearGradient>
    <linearGradient id="legno" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DFAE72"/>
      <stop offset="1" stop-color="#8F5620"/>
    </linearGradient>
    <linearGradient id="casco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD645"/>
      <stop offset="1" stop-color="#EFA400"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="54" fill="url(#fondo)"/>

  <!-- CORPO (trave) -->
  <path d="M44 130 Q128 106 212 130 L212 198 Q212 220 190 220 L66 220 Q44 220 44 198 Z"
        fill="url(#legno)" stroke="#3A2A1E" stroke-width="9" stroke-linejoin="round"/>
  <!-- venature -->
  <path d="M86 124 Q80 172 86 216" fill="none" stroke="#7C4A20" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  <path d="M170 124 Q176 172 170 216" fill="none" stroke="#7C4A20" stroke-width="7" stroke-linecap="round" opacity="0.85"/>

  <!-- OCCHI -->
  <ellipse cx="103" cy="162" rx="20" ry="21" fill="#FFFFFF" stroke="#3A2A1E" stroke-width="8"/>
  <ellipse cx="153" cy="162" rx="20" ry="21" fill="#FFFFFF" stroke="#3A2A1E" stroke-width="8"/>
  <circle cx="107" cy="165" r="9" fill="#2B2620"/>
  <circle cx="157" cy="165" r="9" fill="#2B2620"/>

  <!-- SORRISO -->
  <path d="M106 195 Q128 211 150 195" fill="none" stroke="#3A2A1E" stroke-width="8" stroke-linecap="round"/>

  <!-- CASCHETTO -->
  <path d="M58 116 Q58 40 128 38 Q198 40 198 116 Z" fill="url(#casco)" stroke="#3A2A1E" stroke-width="9" stroke-linejoin="round"/>
  <rect x="30" y="110" width="196" height="22" rx="11" fill="url(#casco)" stroke="#3A2A1E" stroke-width="9"/>
  <path d="M128 44 L128 110" stroke="#DA9A00" stroke-width="8" stroke-linecap="round"/>
  <path d="M78 106 Q82 64 112 48" fill="none" stroke="#FFE894" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
</svg>
